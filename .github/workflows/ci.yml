name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # server and client type-check against @vo/shared's emitted .d.ts files
      - run: npm run build:shared

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run smoke

      # Reported but not yet blocking: the known findings are tracked in the
      # dependency-hardening branch (audit SEC-13). Make this blocking once that lands.
      - name: npm audit (high and above)
        run: npm audit --audit-level=high
        continue-on-error: true

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vo
          POSTGRES_PASSWORD: vo
          POSTGRES_DB: vo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vo -d vo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Tests read TEST_DATABASE_URL (they never use DATABASE_URL).
      TEST_DATABASE_URL: postgres://vo:vo@localhost:5432/vo_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build:shared

      # Migrations: fresh, re-run, legacy upgrade, concurrent start, newer-build
      # refusal, and surviving a dropped idle connection.
      - run: npm run test:postgres
      # The full server suite on the Postgres backend (TEST_DATABASE_URL is set).
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # .dockerignore is an allowlist, so a file the build needs but isn't
      # listed fails here rather than at deploy time.
      - run: docker build -t vo:ci .

      - name: Image boots in production mode and passes its healthcheck
        run: |
          docker run -d --name vo -p 2567:2567 \
            -e JWT_SECRET="$(openssl rand -base64 48)" \
            -e GITHUB_CLIENT_ID=ci -e GITHUB_CLIENT_SECRET=ci \
            vo:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' vo)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' vo | grep -qx healthy
          curl -fsS localhost:2567/health
          curl -fsS localhost:2567/ready
          test "$(docker run --rm --entrypoint id vo:ci -u)" != 0
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:2567/auth/dev)" = 404

      - name: Container logs
        if: failure()
        run: docker logs vo

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURN_URLS: turn:127.0.0.1:3478?transport=udp,turn:127.0.0.1:3478?transport=tcp
      TURN_SECRET: ci-only-turn-secret-00000000000000000000
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # A real TURN relay for e2e/turn.spec.ts (same settings as the local dev
      # one in docker-compose.dev.yml, including relaying on localhost).
      - name: Start coturn
        run: |
          docker run -d --name turn --network host coturn/coturn:4.18.0-alpine \
            -n --listening-port=3478 --min-port=49152 --max-port=49252 \
            --realm=virtual-office --use-auth-secret --static-auth-secret="$TURN_SECRET" \
            --fingerprint --allow-loopback-peers --no-multicast-peers --no-tls --log-file=stdout

      - run: npm run test:e2e

      - name: coturn logs
        if: failure()
        run: docker logs turn

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
