name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # server and client type-check against @vo/shared's emitted .d.ts files
      - run: npm run build:shared

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run smoke

      # Reported but not yet blocking: the known findings are tracked in the
      # dependency-hardening branch (audit SEC-13). Make this blocking once that lands.
      - name: npm audit (high and above)
        run: npm audit --audit-level=high
        continue-on-error: true
