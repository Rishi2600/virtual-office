# Single-VPS deployment: the app, its Postgres, and a TURN relay (coturn).
# Put nginx or Caddy in front for TLS — browsers only grant camera, microphone
# and screen capture on a secure origin. The TURN relay is reached directly,
# not through the proxy; see README "TURN" for the firewall ports to open.
# Logs are kept small and short (owner decision): each service keeps at most
# 4 files of 5 MB, roughly the last two weeks for a ~20-person office. Docker
# rotates by size, not by date, so busier offices keep fewer days.
x-logging: &logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "4"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: vo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: virtual_office
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vo -d virtual_office"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    logging: *logging
    # Small init process as PID 1: forwards signals and reaps zombies.
    init: true
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Localhost only: the TLS proxy (nginx/Caddy) on this host is the public
      # entry point. Plain HTTP must not be reachable from outside.
      - "127.0.0.1:2567:2567"
    environment:
      NODE_ENV: production
      PORT: 2567
      DATABASE_URL: postgres://vo:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/virtual_office
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # GitHub is the only sign-in; the server refuses to start without it.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:2567/auth/github/callback}
      ALLOWED_EMAIL_DOMAIN: ${ALLOWED_EMAIL_DOMAIN:-}
      # The address people open; only pages from here may use the office.
      PUBLIC_URL: ${PUBLIC_URL:-}
      # The TLS proxy on this host is in front of the app.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # NAT traversal. STUN finds people's public addresses; TURN relays calls
      # for people whose network blocks direct connections. The app signs
      # short-lived TURN credentials with TURN_SECRET, which coturn shares.
      STUN_URLS: ${STUN_URLS:-stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302}
      TURN_URLS: ${TURN_URLS:?set TURN_URLS in .env, e.g. turn:your-domain:3478?transport=udp,turn:your-domain:3478?transport=tcp}
      TURN_SECRET: ${TURN_SECRET:?set TURN_SECRET in .env (openssl rand -hex 32)}
      TURN_TTL_SEC: ${TURN_TTL_SEC:-86400}

  # TURN relay for people whose network blocks direct peer-to-peer calls.
  # Calls stay end-to-end encrypted through it; it only forwards packets.
  turn:
    image: coturn/coturn:4.18.0-alpine
    restart: unless-stopped
    logging: *logging
    # Host networking: coturn needs the server's public IP and a whole UDP port
    # range; publishing that range through Docker's NAT is slow and fragile.
    network_mode: host
    command:
      - -n # no config file: everything is below
      - --listening-port=3478 # UDP and TCP
      - --min-port=49152 # relay ports, one per relayed call leg:
      - --max-port=49352 # open these UDP ports in the firewall too
      - --realm=${TURN_REALM:-virtual-office}
      # Only credentials signed by the app with the shared secret are accepted.
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?set TURN_SECRET in .env (openssl rand -hex 32)}
      - --fingerprint
      - --stale-nonce=600
      # Limits so one account (or a leaked credential) can't hog the relay.
      - --user-quota=12
      - --total-quota=200
      # Never relay into private or special networks: the relay must not be a
      # way into this server's internal services or a cloud metadata endpoint.
      - --no-multicast-peers
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.0.0.0-192.0.0.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=198.18.0.0-198.19.255.255
      - --denied-peer-ip=::1
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      # Plain UDP/TCP on 3478 for now; TURN over TLS on 443 is an add-on (README).
      - --no-tls
      # coturn logs every relayed connection with the person's IP address, and
      # has no setting to leave addresses out; logs never name people by IP
      # (owner decision), so its routine log is discarded. A failed start still
      # shows: the container exits and its status says so.
      - --log-file=/dev/null
      - --no-stdout-log
      # On a cloud host whose public IP isn't on the network interface (AWS,
      # GCP, Azure), also add:  - --external-ip=PUBLIC_IP/PRIVATE_IP

volumes:
  db-data:
